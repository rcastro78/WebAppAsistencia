<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title th:text="${esEdicion} ? 'Editar Usuario' : 'Nuevo Usuario'">Usuario</title>
  <link rel="stylesheet" th:href="@{/css/empresa.css}">
</head>
<body>
<div class="app">
  <div class="header">
    <h1 th:text="${esEdicion} ? 'Editar Usuario' : 'Nuevo Usuario'">Usuario</h1>
    <span class="subtitle" th:if="${!esEdicion}">La contraseña de acceso se generará y enviará automáticamente al correo indicado.</span>
  </div>

  <div class="card">
    <div class="card-body">
      <form th:action="@{/usuarios/corporativos/guardar}" th:object="${usuario}" method="post">
        <input type="hidden" th:field="*{idUsuarioClienteCorp}">
        <input type="hidden" th:field="*{nitProveedor}">
        <div class="form-grid">
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}" class="input" required maxlength="45">
          </div>

          <div class="form-group">
            <label>Apellido</label>
            <input type="text" th:field="*{apellido}" class="input" required maxlength="45">
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{emailAsociado}" class="input" required maxlength="45">
          </div>

          <div class="form-group">
            <label>DUI</label>
            <input type="dui" th:field="*{dui}" class="input" required maxlength="45">
          </div>

          <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" th:field="*{telefono}" class="input" maxlength="45">
          </div>

          <div class="form-group">
            <label>Estado</label>
            <select th:field="*{estado}" class="input" required>
              <option value="1">Activo</option>
              <option value="0">Inactivo</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn"><i class="fas fa-save"></i> Guardar</button>
          <a th:href="@{/usuarios/corporativos}" class="btn secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
