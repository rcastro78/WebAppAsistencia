<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala no disponible</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap');
    :root {
        --red:#ef4444; --bg:#0d0f1a; --surface:#161827; --surface2:#1e2035;
        --border:rgba(239,68,68,0.2); --text:#e8eaf6; --muted:#6b7280;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
        font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
        min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    }
    .card{
        background:var(--surface);border:1px solid var(--border);border-radius:20px;
        padding:40px 36px;width:100%;max-width:420px;text-align:center;
        box-shadow:0 20px 60px rgba(0,0,0,.5);
    }
    .icon{
        width:80px;height:80px;border-radius:50%;
        background:rgba(239,68,68,.1);border:2px solid rgba(239,68,68,.3);
        display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--red);
        margin:0 auto 20px;
    }
    h1{font-size:1.3rem;font-weight:700;margin-bottom:8px;}
    .subtitle{font-size:.9rem;color:var(--muted);margin-bottom:28px;line-height:1.5;}
    .btn-volver{
        display:inline-flex;align-items:center;gap:8px;
        background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;
        padding:12px 28px;border-radius:12px;text-decoration:none;font-size:.9rem;
        font-weight:600;transition:opacity .2s;
    }
    .btn-volver:hover{opacity:.9;}
  </style>
</head>
<body>
<div class="card">
  <div class="icon"><i class="fas fa-calendar-times"></i></div>
  <h1>Esta sala ya no está disponible</h1>
  <p class="subtitle" th:text="${mensaje != null ? mensaje : 'El horario de esta cita ya expiró.'}">
    El horario de esta cita ya expiró.
  </p>
  <a href="/telemedicina/citas" class="btn-volver">
    <i class="fas fa-arrow-left"></i> Volver a mis citas
  </a>
</div>
</body>
</html>
