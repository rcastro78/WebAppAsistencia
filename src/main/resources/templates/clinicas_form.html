<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${esEdicion} ? 'Editar Clínica' : 'Nueva Clínica'"></title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/medicos.css}">
  <style>
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem 1.5rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .form-group.full-width {
      grid-column: 1 / -1;
    }
    .form-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #374151;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .form-group input,
    .form-group select {
      padding: 0.6rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
    }
    .form-group select:disabled {
      background: #f3f4f6;
      color: #9ca3af;
      cursor: not-allowed;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    .form-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
    }
    .btn-secondary:hover {
      background: #e5e7eb;
    }
    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1 th:text="${esEdicion} ? 'Editar Clínica' : 'Nueva Clínica'"></h1>
    <span class="subtitle" th:text="'Dr(a). ' + ${medico.nombre} + ' ' + ${medico.apellido}"></span>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 th:text="${esEdicion} ? 'Datos de la Clínica' : 'Registrar Clínica'"></h2>
      <a th:href="@{/medicos/clinicas/{dui}(dui=${medico.dui})}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Cancelar
      </a>
    </div>

    <div class="breadcrumb">
      <a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Dashboard</a>
      <i class="fas fa-chevron-right"></i>
      <a th:href="@{/medicos/listar}">Médicos</a>
      <i class="fas fa-chevron-right"></i>
      <a th:href="@{/medicos/clinicas/{dui}(dui=${medico.dui})}">Clínicas</a>
      <i class="fas fa-chevron-right"></i>
      <span th:text="${esEdicion} ? 'Editar' : 'Nueva'"></span>
    </div>

    <div th:if="${error}" class="alert alert-error">
      <i class="fas fa-exclamation-circle"></i>
      <span th:text="${error}"></span>
    </div>

    <div class="card-body">
      <form th:action="${esEdicion}
                        ? @{/medicos/clinicas/editar/guardar}
                        : @{/medicos/clinicas/nueva/{dui}(dui=${medico.dui})}"
            th:object="${clinica}"
            method="post"
            class="form-grid">

        <!-- Campos ocultos solo en modo edición: identifican la clínica sin exponer el ID en la URL -->
        <input type="hidden" th:if="${esEdicion}" name="idClinica" th:value="${clinica.idClinica}">
        <input type="hidden" th:if="${esEdicion}" name="dui" th:value="${medico.dui}">

        <div class="form-group">
          <label for="nombreClinica"><i class="fas fa-hospital-alt"></i> Nombre de la Clínica</label>
          <input type="text" id="nombreClinica" th:field="*{nombreClinica}" required maxlength="100">
        </div>

        <div class="form-group full-width">
          <label for="direccion"><i class="fas fa-map-marker-alt"></i> Dirección</label>
          <input type="text" id="direccion" th:field="*{direccion}" required maxlength="200">
        </div>

        <div class="form-group">
          <label for="idDepto"><i class="fas fa-map"></i> Departamento</label>
          <select id="idDepto" th:field="*{idDepto}" required>
            <option value="">-- Seleccione --</option>
            <option th:each="dep : ${departamentos}"
                    th:value="${dep.idDepto}"
                    th:text="${dep.nombreDepartamento}"></option>
          </select>
        </div>

        <div class="form-group">
          <label for="idMunicipio"><i class="fas fa-map-pin"></i> Municipio</label>
          <select id="idMunicipio" th:field="*{idMunicipio}" required disabled>
            <option value="">-- Seleccione un departamento primero --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="telefono"><i class="fas fa-phone"></i> Teléfono</label>
          <input type="text" id="telefono" th:field="*{telefono}" maxlength="20">
        </div>

        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> Correo</label>
          <input type="email" id="email" th:field="*{email}" maxlength="100">
        </div>

        <div class="form-group" th:if="${esEdicion}">
          <label for="estado"><i class="fas fa-toggle-on"></i> Estado</label>
          <select id="estado" th:field="*{estado}">
            <option value="1">Activa</option>
            <option value="0">Inactiva</option>
          </select>
        </div>

        <div class="form-actions full-width">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i>
            <span th:text="${esEdicion} ? 'Guardar Cambios' : 'Guardar Clínica'"></span>
          </button>
          <a th:href="@{/medicos/clinicas/{dui}(dui=${medico.dui})}" class="btn btn-secondary">
            Cancelar
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<script th:inline="javascript">
  const municipioSelect = document.getElementById('idMunicipio');
  const departamentoSelect = document.getElementById('idDepto');

  // Valores iniciales si venimos en modo edición
  const idDeptoInicial = /*[[${clinica.idDepto}]]*/ null;
  const idMunicipioInicial = /*[[${clinica.idMunicipio}]]*/ null;

  function cargarMunicipios(idDepto, seleccionar) {
    municipioSelect.innerHTML = '<option value="">Cargando...</option>';
    municipioSelect.disabled = true;

    if (!idDepto) {
      municipioSelect.innerHTML = '<option value="">-- Seleccione un departamento primero --</option>';
      return;
    }

    fetch(`/medicos/municipios/${idDepto}`)
      .then(res => res.json())
      .then(municipios => {
        municipioSelect.innerHTML = '<option value="">-- Seleccione --</option>';
        municipios.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.idMunicipio;
          opt.textContent = m.munNombre;
          if (seleccionar && Number(seleccionar) === m.idMunicipio) {
            opt.selected = true;
          }
          municipioSelect.appendChild(opt);
        });
        municipioSelect.disabled = false;
      })
      .catch(() => {
        municipioSelect.innerHTML = '<option value="">Error al cargar municipios</option>';
      });
  }

  departamentoSelect.addEventListener('change', function () {
    cargarMunicipios(this.value, null);
  });

  // Si venimos en modo edición, precargar municipios del departamento actual
  if (idDeptoInicial) {
    cargarMunicipios(idDeptoInicial, idMunicipioInicial);
  }
</script>
</body>
</html>
